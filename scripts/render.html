<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OVERSLAB product render</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* 1200×1500 product image: framed slab on the brand ground, same look as the site */
  html,body{margin:0;background:#0a0a0d;overflow:hidden}
  .stage{position:relative;width:1200px;height:1500px;display:grid;place-items:center;
    background:linear-gradient(180deg,#1a1a22,#121218)}
  .glow{position:absolute;left:50%;top:44%;width:1000px;height:1000px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,var(--glow) 0%,transparent 60%);filter:blur(80px);opacity:.42}
  .floor{position:absolute;left:20%;right:20%;bottom:9%;height:8%;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,255,255,.10),transparent 70%);filter:blur(24px)}
  .stage .piece{width:620px;filter:drop-shadow(0 60px 80px rgba(0,0,0,.7))}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="glow"></div><div class="floor"></div><div class="piece" id="piece"></div></div>
<script src="../cards.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get('slug') || 'dark-magician';
  const c = bySlug(slug); if (!c) document.title = 'UNKNOWN SLUG';
  document.getElementById('stage').style.setProperty('--glow', c.glow);
  // absolute URL: Chrome resolves url() inside custom properties against the stylesheet, not this page
  document.getElementById('piece').style.setProperty('--art', `url('${new URL('../img/cards/' + c.slug + '.jpg', location.href).href}')`);
  document.getElementById('piece').innerHTML = pieceHTML(c);
</script>
</body>
</html>
